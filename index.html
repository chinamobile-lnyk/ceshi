<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试结束 · 提示</title>
    <!-- 简单内联样式，确保任何环境下一打开即见提示 -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            padding: 1.5rem;
            /* 柔和的渐变背景，视觉舒适 */
            background: radial-gradient(circle at 20% 30%, #ffffff, #eef2f9);
        }

        .notice-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 3rem;
            padding: 4rem 5rem;
            box-shadow: 0 25px 40px -12px rgba(0, 20, 40, 0.25),
                        0 2px 10px -4px rgba(0, 0, 0, 0.05),
                        inset 0 1px 2px rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.6);
            text-align: center;
            max-width: 90vw;
            transition: all 0.2s ease;
            animation: gentleEnter 0.6s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .message {
            font-size: clamp(3rem, 12vw, 6rem);
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
            color: #1e293b;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* 小装饰：简单圆点，增加一点呼吸感 */
        .message::before,
        .message::after {
            content: "•";
            font-size: 0.8em;
            opacity: 0.5;
            color: #3b82f6;
            font-weight: 400;
        }

        /* 确保在移动端也有很好的显示 */
        @media (max-width: 480px) {
            .notice-card {
                padding: 3rem 1.5rem;
                border-radius: 2.5rem;
                width: 100%;
            }
            .message::before,
            .message::after {
                display: none; /* 小屏省略装饰，让文字更干净 */
            }
        }

        /* 极其细腻的入场动画，不突兀 */
        @keyframes gentleEnter {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(8px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* 为了减少重复动效偏好，尊重用户系统设置 */
        @media (prefers-reduced-motion: reduce) {
            .notice-card {
                animation: none;
                opacity: 1;
                transform: none;
            }
        }

        /* 可选: 加一个隐藏的访问性标题，但视觉上已经清晰 */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>
    <!-- 测试结束提示，语义化使用 main 角色 -->
    <main class="notice-card" role="status" aria-live="polite">
        <div class="message">
            测试结束
        </div>
        <span class="visually-hidden">测试已结束，感谢您的参与。</span>
    </main>

    <!-- 
        严格按照需求：访问后提示“测试结束”。
        无需交互，没有多余脚本，纯提示。
        页面加载即为结束状态。
    -->
</body>
</html>
