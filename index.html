<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>汇报展示 · 已结束</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available; /* 兼容 iOS */
        }

        body {
            /* 舒适背景图：柔和渐变风景 + 抽象模糊，加载快速，无外部依赖 */
            background-image: 
                radial-gradient(circle at 10% 30%, rgba(210, 230, 255, 0.55) 0%, transparent 35%),
                radial-gradient(circle at 90% 70%, rgba(220, 240, 230, 0.6) 0%, transparent 45%),
                linear-gradient(145deg, #f0f7fe 0%, #dbeafe 30%, #c7e0f4 60%, #d9ecfa 100%);
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; /* 轻微滚动体验，背景固定 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', 'Noto Sans', sans-serif;
            padding: 1.25rem;
            /* 针对极细屏幕，让底部安全区留白更自然 */
            padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
            padding-top: max(1.25rem, env(safe-area-inset-top));
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 卡片容器：干净、舒适、适合移动端的圆角与阴影 */
        .report-card {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 2.5rem;
            padding: 2.8rem 2rem;
            box-shadow: 
                0 30px 50px -20px rgba(0, 40, 70, 0.3),
                0 8px 20px -8px rgba(0, 0, 0, 0.08),
                inset 0 1px 2px rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.7);
            text-align: center;
            transition: all 0.25s ease;
            animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            /* 让文字可以自然换行并保持居中 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* 主提示文字 */
        .main-message {
            font-size: clamp(1.8rem, 7vw, 2.8rem);
            font-weight: 600;
            color: #1e2f4a;
            letter-spacing: -0.01em;
            margin-bottom: 1.2rem;
            line-height: 1.3;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
            word-break: break-word;
        }

        /* 强调语气，可通过加粗体现“汇报已结束” */
        .main-message .highlight {
            font-weight: 700;
            color: #1e3a6b;
            display: inline-block; /* 让强调部分自然换行 */
        }

        /* 辅助说明文字，温和存在 */
        .sub-message {
            font-size: clamp(1rem, 4.2vw, 1.25rem);
            font-weight: 400;
            color: #486581;
            max-width: 34rem;
            margin: 0.5rem 0 0.2rem;
            padding: 0 0.25rem;
            line-height: 1.6;
            letter-spacing: 0.01em;
            opacity: 0.9;
        }

        /* 装饰性分隔线——用极轻的元素增加层次 */
        .divider {
            width: 5rem;
            height: 3px;
            background: linear-gradient(90deg, transparent, #7ba9d4, #7ba9d4, transparent);
            border-radius: 4px;
            margin: 1.2rem 0 0.5rem;
            opacity: 0.55;
        }

        /* 针对手机屏幕优化内边距和字号 */
        @media (max-width: 480px) {
            body {
                padding: 1rem;
                padding-top: max(1rem, env(safe-area-inset-top));
                padding-bottom: max(1rem, env(safe-area-inset-bottom));
            }
            .report-card {
                padding: 2.2rem 1.5rem;
                border-radius: 2rem;
            }
            .main-message {
                font-size: clamp(1.6rem, 7vw, 2.2rem);
                margin-bottom: 0.8rem;
            }
            .sub-message {
                font-size: 0.95rem;
            }
            .divider {
                margin: 1rem 0 0.2rem;
                width: 4rem;
            }
        }

        /* 横屏时宽度稍微限制，依然保持舒适 */
        @media (orientation: landscape) and (max-height: 500px) {
            .report-card {
                padding: 1.8rem 2rem;
            }
            .main-message {
                font-size: 1.8rem;
                margin-bottom: 0.5rem;
            }
            .divider {
                margin: 0.6rem 0 0.2rem;
            }
        }

        /* 极窄设备 (如折叠屏副屏或小手机) */
        @media (max-width: 340px) {
            .report-card {
                padding: 1.8rem 1rem;
            }
            .main-message {
                font-size: 1.4rem;
            }
        }

        /* 柔和入场动画 */
        @keyframes cardIn {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(14px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        /* 支持减少动态效果偏好 */
        @media (prefers-reduced-motion: reduce) {
            .report-card {
                animation: none;
                opacity: 1;
                transform: none;
            }
            body {
                background-attachment: scroll; /* 固定背景在部分设备可能有兼容性问题，尊重减少动态 */
            }
        }

        /* 微调选中文字颜色，不必须但增加细节 */
        ::selection {
            background: rgba(30, 58, 107, 0.15);
            color: #0a1e33;
        }

        /* 隐藏无障碍文本 */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* 确保背景图在iOS下不会出现奇怪裁切，body已设置background-attachment: fixed 但在某些移动浏览器可能不生效，用伪元素覆盖一层更柔和的叠加 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 30% 40%, rgba(255, 255, 255, 0.35) 0%, transparent 70%);
            pointer-events: none;  /* 不干扰点击 */
            z-index: -1;
        }
    </style>
</head>
<body>
    <!-- 主内容区域：使用 main 标签，并添加 ARIA 状态 -->
    <main class="report-card" role="status" aria-live="polite">
        <!-- 主提示: 分为两行清晰展示，符合要求。根据设计，自然换行 -->
        <h1 class="main-message">
            本页面仅用于汇报展示使用，<br class="mobile-break">汇报已结束。
        </h1>
        
        <!-- 装饰分隔 -->
        <div class="divider" aria-hidden="true"></div>
        
        <!-- 辅助说明，使页面更完整，也补充信息，但不喧宾夺主 -->
        <p class="sub-message">
            感谢您的关注与参与
        </p>
        
        <!-- 无障碍隐藏提示，完整描述 -->
        <span class="visually-hidden">本页面仅用于汇报展示使用，汇报已结束。</span>
    </main>

    <!-- 不需要任何脚本，纯粹展示 -->
</body>
</html>
